name: Cloudflare RDP Tunnel

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Create cloudflared credentials file
        shell: pwsh
        run: |
          $env:CLOUDFLARE_CREDS | Out-File -Encoding ascii creds.json
        env:
          CLOUDFLARE_CREDS: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Create cloudflared config
        shell: pwsh
        run: |
          @"
          tunnel: rdp
          credentials-file: creds.json

          ingress:
            - service: rdp://localhost:3389
            - service: http_status:404
          "@ | Out-File -Encoding ascii cloudflared.yml

      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

      - name: Download cloudflared
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
            -OutFile cloudflared.exe

      - name: Start Cloudflare Tunnel
        shell: pwsh
        run: |
          .\cloudflared.exe tunnel --config cloudflared.yml run
